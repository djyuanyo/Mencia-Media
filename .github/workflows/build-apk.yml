name: Generar APK de PrimePlex

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar y Publicar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Aceptar licencias y configurar entorno
        run: |
          touch .env
          cp .env.example .env 2>/dev/null || true
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n84831b9409646a532e3034252650a149d425c276\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf "601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "$ANDROID_HOME/licenses/android-googletv-license"
          printf "859f317696f67ef3d7f30a50a5560e7834b43903\n" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          yes | sdkmanager --licenses || true

      - name: Asegurar debug.keystore
        run: |
          if [ ! -s debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Decodificando debug.keystore.base64..."
              tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore 2>/dev/null || base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
            fi
          fi
          if [ ! -s debug.keystore ]; then
            echo "Generando debug.keystore de respaldo..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: Compilar APK (Debug)
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m" --stacktrace

      - name: Preparar APK
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/PrimePlex-debug.apk
          ls -la release-apk/

      - name: Subir artefacto APK para descarga directa
        uses: actions/upload-artifact@v4
        with:
          name: PrimePlex-APK
          path: release-apk/PrimePlex-debug.apk
          retention-days: 30

      - name: Subir artefacto macOS DMG para descarga directa
        uses: actions/upload-artifact@v4
        with:
          name: PrimePlex-macOS-DMG
          path: PrimePlex-macOS.dmg
          retention-days: 30
          if-no-files-found: warn

      - name: Subir artefacto macOS ZIP para descarga directa
        uses: actions/upload-artifact@v4
        with:
          name: PrimePlex-macOS-ZIP
          path: PrimePlex-macOS.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Publicar Release en GitHub con APK y DMG macOS
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "PrimePlex v1.0.${{ github.run_number }}"
          body: |
            ### 🎬 PrimePlex - Versión Oficial Multiplataforma
            Versión generada automáticamente desde el código fuente del proyecto (Build #${{ github.run_number }}).

            **📥 Descargas oficiales:**
            * 🍏 **macOS:** Haz clic en `PrimePlex-macOS.dmg` abajo para instalar directamente en Mac (Apple Silicon M1/M2/M3/M4 o Intel) sin emuladores.
            * 📱 **Android:** Haz clic en `PrimePlex-debug.apk` abajo para instalar en tu dispositivo Android o Android TV.
          files: |
            release-apk/PrimePlex-debug.apk
            PrimePlex-macOS.dmg
            PrimePlex-macOS.zip
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
